<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 48" fill="none" aria-label="SSLCOMMERZ Secure Payment Gateway">
  <!-- SSLCommerz Brand Badge -->
  <g transform="translate(0, 4)">
    <!-- SSL Shield Icon -->
    <path d="M12 2L4 6V16C4 22.2 8.3 27.9 14 29.5C19.7 27.9 24 22.2 24 16V6L16 2Z" fill="#2563EB" opacity="0.2"/>
    <path d="M12 4L6 7.5V15.5C6 20.6 9.6 25.3 14 26.7C18.4 25.3 22 20.6 22 15.5V7.5L16 4Z" stroke="#3B82F6" stroke-width="1.5" fill="none"/>
    <path d="M11 14L13.5 16.5L17 11.5" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- SSLCommerz Text -->
    <text x="30" y="16" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="13" letter-spacing="0.5">SSL<tspan fill="#38BDF8">COMMERZ</tspan></text>
    <text x="30" y="26" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="8" letter-spacing="0.8">100% SECURE PAYMENT</text>
  </g>

  <!-- Divider -->
  <line x1="165" y1="10" x2="165" y2="38" stroke="#334155" stroke-width="1"/>

  <!-- Payment Provider Badges -->
  <g transform="translate(175, 8)">
    <!-- VISA -->
    <rect x="0" y="0" width="42" height="28" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="21" y="18" fill="#60A5FA" font-family="Arial, sans-serif" font-weight="900" font-size="11" font-style="italic" text-anchor="middle" letter-spacing="1">VISA</text>

    <!-- MasterCard -->
    <g transform="translate(48, 0)">
      <rect x="0" y="0" width="42" height="28" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="14" r="7" fill="#EB001B" opacity="0.9"/>
      <circle cx="26" cy="14" r="7" fill="#F79E1B" opacity="0.9"/>
    </g>

    <!-- bKash -->
    <g transform="translate(96, 0)">
      <rect x="0" y="0" width="42" height="28" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <path d="M12 18L18 8L24 18H12Z" fill="#E2136E" opacity="0.2"/>
      <text x="21" y="18" fill="#F472B6" font-family="-apple-system, sans-serif" font-weight="800" font-size="9" text-anchor="middle">bKash</text>
    </g>

    <!-- Nagad -->
    <g transform="translate(144, 0)">
      <rect x="0" y="0" width="42" height="28" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="21" y="18" fill="#FB923C" font-family="-apple-system, sans-serif" font-weight="800" font-size="9" text-anchor="middle">Nagad</text>
    </g>

    <!-- AMEX -->
    <g transform="translate(192, 0)">
      <rect x="0" y="0" width="42" height="28" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="21" y="17" fill="#38BDF8" font-family="Arial, sans-serif" font-weight="900" font-size="8" text-anchor="middle" letter-spacing="0.5">AMEX</text>
    </g>
  </g>
</svg>
